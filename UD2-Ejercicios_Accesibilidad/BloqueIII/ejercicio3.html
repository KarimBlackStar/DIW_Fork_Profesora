<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3 - Siglas y Fechas Accesibles</title>
  <link rel = "stylesheet" href = "style.css">
</head>

<body>
  <header class="terminologia">Terminología accesibilidad de la Web</header>
  <div>
    <div class="cards">
      <div class="card">
        <p style="font-size: 1.5rem;font-weight: bold;">Estándares Web</p>
        <!-- FALLO: El lector de pantalla intentará leer "WCAG" como una sola palabra impronunciable -->
        <p>El estándar <span class="sigla badge-sigla">WCAG</span> es importante.</p>
        <!-- FALLO: El lector leerá "28 barra 09 barra 2026" en lugar de pronunciar la fecha de forma fluida -->
        <p>Última revisión: 28/09/2026</p>
      </div>
      <div class="card">
        <p class="badge-sigla"><span class="sigla badge-sigla">WAI</span></p>
        <p>Una de las principales iniciativas del W3C es la WAI (Web Accessibility Initiative) que se encarga del
          desarrollo de
          normas de accesibilidad.
        </p>
      </div>
    </div>
  </div>
</body>

</html>
